<div class="data-table card-soft">
  @if (searchable()) {
    <div class="data-table__toolbar">
      <mat-form-field appearance="outline" class="data-table__search">
        <mat-label>Search</mat-label>
        <input matInput [ngModel]="query()" (ngModelChange)="onSearch($event)" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  }

  <div class="data-table__wrap">
    <table mat-table [dataSource]="pagedRows()" class="data-table__table">
      @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef [style.width]="column.width">{{ column.label }}</th>
          <td mat-cell *matCellDef="let row">{{ cellValue(row, column) }}</td>
        </ng-container>
      }

      @if (showActions()) {
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="data-table__actions-header">Actions</th>
          <td mat-cell *matCellDef="let row" class="data-table__actions">
            <button type="button" mat-icon-button aria-label="Edit row" (click)="editRow.emit(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              type="button"
              mat-icon-button
              color="warn"
              aria-label="Delete row"
              (click)="deleteRow.emit(row)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>

    @if (!pagedRows().length) {
      <p class="data-table__empty">No records found.</p>
    }
  </div>

  <mat-paginator
    [length]="totalRows()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="onPage($event)"
    showFirstLastButtons
  />
</div>
