<header
  class="section-heading"
  [class.section-heading--center]="align() === 'center'"
>
  @if (eyebrow()) {
    <p class="section-heading__eyebrow">{{ eyebrow() }}</p>
  }
  <h2 class="section-heading__title">{{ title() }}</h2>
  @if (subtitle()) {
    <p class="section-heading__subtitle">{{ subtitle() }}</p>
  }
</header>
