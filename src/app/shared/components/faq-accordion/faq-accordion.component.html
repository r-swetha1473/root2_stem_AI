<div class="faq-accordion">
  @if (searchable()) {
    <mat-form-field appearance="outline" class="faq-accordion__search">
      <mat-label>{{ searchPlaceholder() }}</mat-label>
      <input matInput [ngModel]="query()" (ngModelChange)="query.set($event)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  }

  @if (filteredItems().length) {
    <mat-accordion multi class="faq-accordion__list">
      @for (item of filteredItems(); track item.title) {
        <mat-expansion-panel class="faq-accordion__panel">
          <mat-expansion-panel-header>
            <mat-panel-title>{{ item.title }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p class="faq-accordion__answer">{{ item.answer }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  } @else {
    <p class="faq-accordion__empty">No FAQs match your search.</p>
  }
</div>
