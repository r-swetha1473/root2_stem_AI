@if (notFound()) {
  <section class="section-pad text-center">
    <h1 class="text-3xl font-bold mb-4">Article not found</h1>
    <a routerLink="/blog" class="btn-primary">Back to Blog</a>
  </section>
} @else if (post(); as p) {
  <article class="section-pad bg-mesh pt-28 md:pt-32">
    <div class="container-r2 max-w-3xl">
      <a routerLink="/blog" class="text-royal text-sm font-semibold mb-4 inline-block">← All Articles</a>
      <span class="text-xs font-semibold text-stem-green uppercase">{{ p.category }}</span>
      <h1 class="text-4xl md:text-5xl font-bold mt-3 mb-4" appGsapReveal>{{ p.title }}</h1>
      <p class="text-navy/60 mb-6">{{ p.author }} · {{ p.read_time }} read</p>
      <img [src]="p.image || '/illustrations/blog-1.svg'" [alt]="p.title" class="w-full rounded-2xl mb-8 bg-white p-8" appGsapReveal />

      <div class="flex gap-3 mb-8">
        <button type="button" class="btn-secondary text-sm py-2 px-4" (click)="share('twitter')">Share on X</button>
        <button type="button" class="btn-secondary text-sm py-2 px-4" (click)="share('linkedin')">LinkedIn</button>
        <button type="button" class="btn-secondary text-sm py-2 px-4" (click)="share('copy')">Copy link</button>
      </div>

      <div class="prose prose-lg max-w-none text-navy/80 leading-relaxed" [innerHTML]="contentHtml()" appGsapReveal></div>
    </div>
  </article>

  @if (related().length) {
    <section class="section-pad bg-surface">
      <div class="container-r2">
        <h2 class="text-2xl font-bold mb-8 text-center">Related Articles</h2>
        <div class="grid md:grid-cols-3 gap-6">
          @for (r of related(); track r.id) {
            <a [routerLink]="['/blog', r.slug]" class="card-soft p-6 block">
              <h3 class="font-bold line-clamp-2">{{ r.title }}</h3>
              <p class="text-navy/60 text-sm mt-2">{{ r.read_time }}</p>
            </a>
          }
        </div>
      </div>
    </section>
  }
}
