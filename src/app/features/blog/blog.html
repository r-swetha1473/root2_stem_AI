<section class="section-pad bg-mesh pt-28 md:pt-32">
  <div class="container-r2">
    <app-section-heading
      eyebrow="Blog"
      highlight="Insights"
      titleRest="& guides"
      subtitle="Career guides, prompting frameworks, and AI workforce trends."
    />

    <div class="flex flex-col md:flex-row gap-4 mb-10 max-w-3xl mx-auto">
      <input
        type="search"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        placeholder="Search articles…"
        class="flex-1 rounded-full border border-navy/15 px-5 py-3 text-sm outline-none focus:border-royal bg-white"
      />
      <select
        [ngModel]="category()"
        (ngModelChange)="category.set($event)"
        class="rounded-full border border-navy/15 px-5 py-3 text-sm outline-none bg-white"
      >
        <option value="">All categories</option>
        @for (cat of categories(); track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
      <select
        [ngModel]="sort()"
        (ngModelChange)="sort.set($event)"
        class="rounded-full border border-navy/15 px-5 py-3 text-sm outline-none bg-white"
      >
        <option value="recent">Recent</option>
        <option value="popular">Popular</option>
      </select>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (b of filtered(); track b.id; let i = $index) {
        <article class="card-soft overflow-hidden" appGsapReveal [appGsapRevealDelay]="i * 0.06">
          <img [src]="b.image || '/illustrations/blog-1.svg'" [alt]="b.title" class="w-full h-44 object-cover bg-white p-6" />
          <div class="p-6">
            <span class="text-xs font-semibold text-stem-green uppercase">{{ b.category }}</span>
            <h2 class="text-lg font-bold mt-2 mb-2 line-clamp-2">{{ b.title }}</h2>
            <p class="text-navy/60 text-sm mb-4 line-clamp-2">{{ b.description }}</p>
            <div class="flex justify-between items-center text-sm">
              <span class="text-navy/50">{{ b.read_time }} · {{ b.views }} views</span>
              <a [routerLink]="['/blog', b.slug]" class="text-royal font-semibold">Read →</a>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
