<section class="section-pad bg-mesh pt-28 md:pt-32">
  <div class="container-r2 max-w-3xl">
    <app-section-heading
      eyebrow="FAQ"
      highlight="Questions"
      titleRest="answered"
      subtitle="Everything you need to know about programs, workshops, and careers."
    />

    <input
      type="search"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
      placeholder="Search FAQs…"
      class="w-full rounded-full border border-navy/15 px-5 py-3 text-sm outline-none focus:border-royal bg-white mb-8"
    />

    <mat-accordion multi>
      @for (f of filtered(); track f.id; let i = $index) {
        <mat-expansion-panel class="!mb-3 !rounded-2xl !shadow-none border border-navy/8" appGsapReveal [appGsapRevealDelay]="i * 0.04">
          <mat-expansion-panel-header>
            <mat-panel-title class="font-semibold !text-navy">{{ f.title }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p class="text-navy/70 leading-relaxed pb-2">{{ f.answer }}</p>
          @if (f.category) {
            <span class="text-xs text-sky font-semibold uppercase">{{ f.category }}</span>
          }
        </mat-expansion-panel>
      }
    </mat-accordion>

    @if (filtered().length === 0) {
      <p class="text-center text-navy/60">No FAQs match your search.</p>
    }
  </div>
</section>
