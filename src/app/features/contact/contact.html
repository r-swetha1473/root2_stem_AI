<section class="section-pad bg-mesh pt-28 md:pt-32">
  <div class="container-r2">
    <app-section-heading
      eyebrow="Contact"
      highlight="Let's talk"
      titleRest="about your AI journey"
      subtitle="Programs, workshops, partnerships, or hiring—we're here to help."
    />

    <div class="grid lg:grid-cols-2 gap-12 max-w-5xl mx-auto">
      <form [formGroup]="form" (ngSubmit)="submit()" class="card-soft p-8 space-y-5" appGsapReveal>
        <div>
          <label class="block text-sm font-medium mb-1">Name</label>
          <input formControlName="name" class="w-full rounded-xl border border-navy/15 px-4 py-3 text-sm outline-none focus:border-royal" />
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" formControlName="email" class="w-full rounded-xl border border-navy/15 px-4 py-3 text-sm outline-none focus:border-royal" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Phone</label>
            <input formControlName="phone" class="w-full rounded-xl border border-navy/15 px-4 py-3 text-sm outline-none focus:border-royal" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Subject</label>
          <input formControlName="subject" class="w-full rounded-xl border border-navy/15 px-4 py-3 text-sm outline-none focus:border-royal" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Message</label>
          <textarea formControlName="message" rows="5" class="w-full rounded-xl border border-navy/15 px-4 py-3 text-sm outline-none focus:border-royal resize-none"></textarea>
        </div>
        <button type="submit" class="btn-primary w-full" [disabled]="submitting() || form.invalid">
          {{ submitting() ? 'Sending…' : 'Send Message' }}
        </button>
        @if (message()) {
          <p class="text-sm" [class.text-stem-green-dark]="success()" [class.text-red-600]="!success()">{{ message() }}</p>
        }
      </form>

      <div appGsapReveal appGsapRevealDirection="right">
        <div class="card-soft p-8 mb-6">
          <h2 class="text-xl font-bold mb-4">Contact Info</h2>
          @if (settings(); as s) {
            <div class="space-y-3 text-navy/70">
              @if (s.email) {
                <p><span class="font-semibold text-navy">Email:</span> <a [href]="'mailto:' + s.email" class="text-royal hover:underline">{{ s.email }}</a></p>
              }
              @if (s.phone) {
                <p><span class="font-semibold text-navy">Phone:</span> <a [href]="'tel:' + s.phone" class="text-royal hover:underline">{{ s.phone }}</a></p>
              }
              @if (s.address) {
                <p><span class="font-semibold text-navy">Address:</span> {{ s.address }}</p>
              }
            </div>
          }
          <div class="flex flex-wrap gap-3 mt-6">
            @for (soc of socials(); track soc.id) {
              <a [href]="soc.url" target="_blank" rel="noopener" class="text-sm text-royal font-semibold capitalize hover:underline">{{ soc.platform }}</a>
            }
          </div>
        </div>

        @if (mapUrl(); as map) {
          <div class="card-soft overflow-hidden rounded-2xl">
            <iframe
              [src]="map"
              class="w-full h-64 border-0"
              loading="lazy"
              title="ROOT2 location map"
            ></iframe>
          </div>
        }
      </div>
    </div>
  </div>
</section>
