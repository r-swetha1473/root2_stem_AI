<header class="sticky top-0 z-50 glass border-b border-white/40">
  <div class="container-r2 flex items-center justify-between gap-3 h-16 md:h-[72px] px-4 md:px-6">
    <a
      routerLink="/"
      class="flex items-center gap-2.5 shrink-0 min-w-0"
      (click)="closeMenu()"
      aria-label="ROOT2 STEM AI home"
    >
      <img
        src="/images/logo-icon.svg"
        alt=""
        class="h-9 w-9 md:h-10 md:w-10 rounded-xl shadow-sm"
        width="40"
        height="40"
      />
      <span class="flex flex-col leading-none">
        <span class="font-display font-extrabold text-navy text-base md:text-lg tracking-tight">
          ROOT<span class="text-stem-green">2</span>
        </span>
        <span class="text-[10px] md:text-[11px] font-semibold tracking-[0.14em] text-royal uppercase mt-0.5">
          STEM AI
        </span>
      </span>
    </a>

    <nav class="hidden lg:flex items-center gap-0.5" aria-label="Main navigation">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-royal bg-royal/5"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="px-3 py-2 rounded-full text-sm font-medium text-navy/75 hover:text-royal transition-colors"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="hidden lg:flex items-center gap-3 shrink-0">
      <a routerLink="/workshops" class="btn-secondary !py-2.5 !px-5 text-sm">Join Workshop</a>
      <a routerLink="/programs" class="btn-primary !py-2.5 !px-5 text-sm">Explore Programs</a>
    </div>

    <button
      type="button"
      class="lg:hidden p-2 rounded-xl text-navy hover:bg-navy/5 shrink-0"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle menu"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (menuOpen()) {
          <path stroke-linecap="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        } @else {
          <path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="lg:hidden border-t border-navy/10 bg-white/95 backdrop-blur-xl px-4 py-4">
      <nav class="flex flex-col gap-1" aria-label="Mobile navigation">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="text-royal bg-royal/5"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="px-4 py-3 rounded-xl text-base font-medium text-navy/80"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
        <div class="grid grid-cols-2 gap-2 mt-3">
          <a routerLink="/workshops" class="btn-secondary text-center !py-3" (click)="closeMenu()">Join Workshop</a>
          <a routerLink="/programs" class="btn-primary text-center !py-3" (click)="closeMenu()">Programs</a>
        </div>
      </nav>
    </div>
  }
</header>
